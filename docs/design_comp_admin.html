<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SOUND·TRADE — 管理画面 デザインカンプ</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; }
  body { font-family: 'Noto Sans JP', -apple-system, sans-serif; background: #F0F1F3; }
  #root { width: 100%; min-height: 100vh; }
  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 100vh; color: #999; font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
  }
</style>
</head>
<body>
<div id="root"><div class="loading">読み込み中…</div></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;

// ============================================================
// SOUND·TRADE 管理画面 デザインカンプ
// ユニバーサルデザイン / CUDカラー / 文字サイズ可変
// ============================================================

// ---- CUD準拠カラー ----
const C = {
  bg:       '#F0F1F3',   // アプリ背景
  surface:  '#FFFFFF',   // カード・パネル
  surfaceAlt:'#F7F8FA',  // 薄いグレー面
  ink:      '#1A1A1A',   // 本文
  inkSub:   '#555555',   // サブ
  inkMute:  '#777777',   // 補助
  line:     '#D5D8DC',   // 罫線
  lineLight:'#E8EAED',
  // CUDステータスカラー
  success:  '#2E7D32',   // 成功・公開中・正常
  successBg:'#E8F3E9',
  warning:  '#F4A300',   // 警告・下書き・要確認
  warningBg:'#FCF2DC',
  danger:   '#D52941',   // エラー・未公開・不整合
  dangerBg: '#FBE4E7',
  info:     '#1976D2',   // 情報・処理中
  infoBg:   '#E4EFFB',
  neutral:  '#6C757D',   // 中立・無効
  neutralBg:'#EBECEE',
  // ブランド
  navy:     '#1B2A41',   // サイドバー
  navyHover:'#2A3F5F',
};

// 文字サイズ3段階（design_tokens.md準拠）
const FONT_SCALE = {
  sm: { base: 14, h1: 24, h2: 20, h3: 17, label: 'A-' },
  md: { base: 16, h1: 28, h2: 22, h3: 19, label: 'A' },
  lg: { base: 18, h1: 32, h2: 26, h3: 22, label: 'A+' },
};

const yen = (n) => '¥' + n.toLocaleString('ja-JP');

// ============================================================
// アイコン（CUD：色だけに頼らずアイコンを併用）
// ============================================================
const Icon = {
  dashboard: (s,c) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8"><rect x="3" y="3" width="8" height="9"/><rect x="13" y="3" width="8" height="5"/><rect x="13" y="10" width="8" height="11"/><rect x="3" y="14" width="8" height="7"/></svg>,
  box: (s,c) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/></svg>,
  upload: (s,c) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>,
  diff: (s,c) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8"><path d="M12 3v18M5 8l-2 4 2 4M19 8l2 4-2 4"/></svg>,
  check: (s,c) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8"><path d="M22 11.5V12a10 10 0 1 1-5.9-9.1M22 4L12 14.1l-3-3"/></svg>,
  inquiry: (s,c) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>,
  ok: (s,c) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.2"><path d="M20 6L9 17l-5-5"/></svg>,
  warn: (s,c) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>,
  error: (s,c) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>,
  info: (s,c) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>,
};

// ============================================================
// ステータスバッジ（色 + アイコン + テキストの三重表現）
// ============================================================
function StatusBadge({ type, label, fs }) {
  const map = {
    success: { c: C.success, bg: C.successBg, icon: Icon.ok },
    warning: { c: C.warning, bg: C.warningBg, icon: Icon.warn },
    danger:  { c: C.danger,  bg: C.dangerBg,  icon: Icon.error },
    info:    { c: C.info,    bg: C.infoBg,    icon: Icon.info },
    neutral: { c: C.neutral, bg: C.neutralBg, icon: Icon.info },
  };
  const s = map[type] || map.neutral;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 5,
      background: s.bg, color: s.c, border: `1px solid ${s.c}40`,
      padding: '4px 9px', borderRadius: 4, fontSize: fs.base - 3,
      fontWeight: 700, whiteSpace: 'nowrap',
    }}>
      {s.icon(fs.base - 3, s.c)}
      {label}
    </span>
  );
}

// ============================================================
// サイドバー
// ============================================================
function Sidebar({ page, onNav, fs }) {
  const items = [
    ['dashboard', 'ダッシュボード', Icon.dashboard],
    ['products',  '商品マスタ',     Icon.box],
    ['import',    'CSV取込',        Icon.upload],
    ['preview',   '差分プレビュー', Icon.diff],
    ['approve',   '反映承認',       Icon.check],
    ['inquiries', '見積依頼',       Icon.inquiry],
  ];
  return (
    <aside style={{
      width: 240, background: C.navy, minHeight: '100vh',
      flexShrink: 0, display: 'flex', flexDirection: 'column',
    }}>
      <div style={{ padding: '24px 20px', borderBottom: '1px solid rgba(255,255,255,0.1)' }}>
        <div style={{ color: '#FFFFFF', fontWeight: 700, fontSize: fs.base + 3, letterSpacing: '0.06em' }}>
          SOUND·TRADE
        </div>
        <div style={{ color: 'rgba(255,255,255,0.5)', fontSize: fs.base - 4, marginTop: 3 }}>
          管理画面
        </div>
      </div>
      <nav style={{ padding: '12px 0', flex: 1 }}>
        {items.map(([id, label, icon]) => {
          const active = page === id;
          return (
            <button key={id} onClick={() => onNav(id)}
              style={{
                width: '100%', display: 'flex', alignItems: 'center', gap: 12,
                padding: '14px 20px', minHeight: 48, border: 'none', cursor: 'pointer',
                background: active ? C.navyHover : 'transparent',
                borderLeft: active ? '4px solid #FFFFFF' : '4px solid transparent',
                color: active ? '#FFFFFF' : 'rgba(255,255,255,0.75)',
                fontSize: fs.base, fontWeight: active ? 700 : 400,
                textAlign: 'left', transition: 'all 150ms ease',
              }}>
              {icon(fs.base + 3, active ? '#FFFFFF' : 'rgba(255,255,255,0.75)')}
              {label}
            </button>
          );
        })}
      </nav>
      <div style={{ padding: '16px 20px', borderTop: '1px solid rgba(255,255,255,0.1)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{
            width: 36, height: 36, borderRadius: '50%', background: C.navyHover,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: '#FFFFFF', fontSize: fs.base - 2, fontWeight: 700,
          }}>鈴</div>
          <div>
            <div style={{ color: '#FFFFFF', fontSize: fs.base - 2, fontWeight: 500 }}>鈴木 淳司</div>
            <div style={{ color: 'rgba(255,255,255,0.5)', fontSize: fs.base - 5 }}>管理者</div>
          </div>
        </div>
      </div>
    </aside>
  );
}

// ============================================================
// トップバー（文字サイズ切替を常設）
// ============================================================
function TopBar({ title, sizeKey, onSize, fs }) {
  return (
    <div style={{
      background: C.surface, borderBottom: `1px solid ${C.line}`,
      padding: '0 32px', height: 68, display: 'flex',
      alignItems: 'center', justifyContent: 'space-between',
    }}>
      <h1 style={{ fontSize: fs.h2, fontWeight: 700, color: C.ink, margin: 0 }}>
        {title}
      </h1>
      <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
        {/* 文字サイズ切替 */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ fontSize: fs.base - 3, color: C.inkSub }}>文字サイズ</span>
          <div style={{ display: 'flex', border: `1px solid ${C.line}`, borderRadius: 6, overflow: 'hidden' }}>
            {Object.entries(FONT_SCALE).map(([k, v]) => (
              <button key={k} onClick={() => onSize(k)}
                aria-pressed={sizeKey === k}
                style={{
                  minWidth: 44, minHeight: 40, border: 'none', cursor: 'pointer',
                  background: sizeKey === k ? C.navy : C.surface,
                  color: sizeKey === k ? '#FFFFFF' : C.inkSub,
                  fontSize: k === 'sm' ? 12 : k === 'md' ? 15 : 18,
                  fontWeight: 700,
                  borderRight: k !== 'lg' ? `1px solid ${C.line}` : 'none',
                }}>{v.label}</button>
            ))}
          </div>
        </div>
        <div style={{
          width: 1, height: 32, background: C.line,
        }} />
        <button style={{
          minHeight: 44, padding: '0 16px', border: `1px solid ${C.line}`,
          borderRadius: 6, background: C.surface, color: C.inkSub,
          fontSize: fs.base - 2, cursor: 'pointer',
        }}>ヘルプ</button>
      </div>
    </div>
  );
}

// ============================================================
// 共通カード
// ============================================================
function Card({ title, children, fs, action }) {
  return (
    <div style={{
      background: C.surface, border: `1px solid ${C.line}`,
      borderRadius: 8, overflow: 'hidden',
    }}>
      {title && (
        <div style={{
          padding: '16px 20px', borderBottom: `1px solid ${C.lineLight}`,
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        }}>
          <h2 style={{ fontSize: fs.h3, fontWeight: 700, color: C.ink, margin: 0 }}>{title}</h2>
          {action}
        </div>
      )}
      <div style={{ padding: 20 }}>{children}</div>
    </div>
  );
}

function PrimaryButton({ children, onClick, fs, danger, full }) {
  return (
    <button onClick={onClick} style={{
      minHeight: 48, padding: '0 24px', width: full ? '100%' : 'auto',
      background: danger ? C.danger : C.navy, color: '#FFFFFF',
      border: 'none', borderRadius: 6, cursor: 'pointer',
      fontSize: fs.base, fontWeight: 700, letterSpacing: '0.02em',
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
    }}>{children}</button>
  );
}

function GhostButton({ children, onClick, fs }) {
  return (
    <button onClick={onClick} style={{
      minHeight: 48, padding: '0 20px',
      background: C.surface, color: C.inkSub,
      border: `1px solid ${C.line}`, borderRadius: 6, cursor: 'pointer',
      fontSize: fs.base, fontWeight: 500,
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
    }}>{children}</button>
  );
}

// ============================================================
// ページ: ダッシュボード
// ============================================================
function DashboardPage({ fs, onNav }) {
  const stats = [
    ['本日の見積依頼', '4', '件', C.info, Icon.inquiry],
    ['未対応の依頼',   '7', '件', C.warning, Icon.warn],
    ['公開中の商品',   '209', '点', C.success, Icon.box],
    ['下書きの商品',   '85', '点', C.neutral, Icon.box],
  ];
  const recentInquiries = [
    ['ST-20260520-0042', '株式会社サウンドミュージック', '3商品', '未対応', 'warning'],
    ['ST-20260520-0041', '田中楽器店',                   '1商品', '対応中', 'info'],
    ['ST-20260519-0040', '市立第一中学校',               '8商品', '完了',   'success'],
    ['ST-20260519-0039', 'スタジオ・ノア',               '2商品', '完了',   'success'],
  ];
  return (
    <div style={{ padding: 32, display: 'flex', flexDirection: 'column', gap: 24 }}>
      {/* 統計カード */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 20 }}>
        {stats.map(([label, num, unit, color, icon]) => (
          <div key={label} style={{
            background: C.surface, border: `1px solid ${C.line}`,
            borderRadius: 8, padding: 20,
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 14 }}>
              <span style={{ fontSize: fs.base - 2, color: C.inkSub }}>{label}</span>
              <div style={{
                width: 36, height: 36, borderRadius: 8,
                background: color + '18', display: 'flex',
                alignItems: 'center', justifyContent: 'center',
              }}>{icon(20, color)}</div>
            </div>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
              <span style={{ fontSize: fs.h1 + 4, fontWeight: 700, color: C.ink }}>{num}</span>
              <span style={{ fontSize: fs.base - 2, color: C.inkSub }}>{unit}</span>
            </div>
          </div>
        ))}
      </div>

      {/* 最近の見積依頼 */}
      <Card title="最近の見積依頼" fs={fs}
        action={<button onClick={() => onNav('inquiries')} style={{
          background: 'none', border: 'none', color: C.info, cursor: 'pointer',
          fontSize: fs.base - 2, fontWeight: 500, textDecoration: 'underline',
        }}>すべて見る</button>}>
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ borderBottom: `2px solid ${C.line}` }}>
              {['受付番号', '会社名', '商品数', 'ステータス'].map(h => (
                <th key={h} style={{
                  textAlign: 'left', padding: '10px 8px',
                  fontSize: fs.base - 2, fontWeight: 700, color: C.inkSub,
                }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {recentInquiries.map(([num, company, count, status, type]) => (
              <tr key={num} style={{ borderBottom: `1px solid ${C.lineLight}` }}>
                <td style={{ padding: '14px 8px', fontSize: fs.base - 1, color: C.ink, fontWeight: 500 }}>{num}</td>
                <td style={{ padding: '14px 8px', fontSize: fs.base - 1, color: C.ink }}>{company}</td>
                <td style={{ padding: '14px 8px', fontSize: fs.base - 1, color: C.inkSub }}>{count}</td>
                <td style={{ padding: '14px 8px' }}>
                  <StatusBadge type={type} label={status} fs={fs} />
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>

      {/* クイックアクション */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 20 }}>
        {[
          ['CSVを取り込む', 'Shopify互換CSVから商品を一括登録', 'import', Icon.upload],
          ['商品マスタを見る', '登録済み商品の確認・編集', 'products', Icon.box],
          ['反映を承認する', '取り込んだ商品を本番に反映', 'approve', Icon.check],
        ].map(([title, desc, target, icon]) => (
          <button key={title} onClick={() => onNav(target)} style={{
            background: C.surface, border: `1px solid ${C.line}`,
            borderRadius: 8, padding: 20, cursor: 'pointer', textAlign: 'left',
            display: 'flex', gap: 14, alignItems: 'flex-start',
          }}>
            <div style={{
              width: 44, height: 44, borderRadius: 8, background: C.navy + '12',
              display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
            }}>{icon(24, C.navy)}</div>
            <div>
              <div style={{ fontSize: fs.base, fontWeight: 700, color: C.ink, marginBottom: 4 }}>{title}</div>
              <div style={{ fontSize: fs.base - 3, color: C.inkSub, lineHeight: 1.6 }}>{desc}</div>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

// ============================================================
// ページ: 商品マスタ
// ============================================================
function ProductsPage({ fs }) {
  const products = [
    ['YAMAHA YCL-255',   'クラリネット', 'yamaha-ycl-255',  105000, 'success', '公開中'],
    ['YAMAHA YAS-280',   'サクソフォン', 'yamaha-yas-280',  160000, 'success', '公開中'],
    ['YAMAHA YTR-8335',  'トランペット', 'yamaha-ytr-8335', 430000, 'success', '公開中'],
    ['YAMAHA YFL-917C',  'フルート',     'yamaha-yfl-917c', 5081818,'warning', '下書き'],
    ['YAMAHA YHR-869D',  'ホルン',       'yamaha-yhr-869d', 1150000,'warning', '下書き'],
    ['YAMAHA YOB-831',   'ダブルリード', 'yamaha-yob-831',  1080000,'success', '公開中'],
    ['YAMAHA YSL-882II', 'トロンボーン', 'yamaha-ysl-882ii',540000, 'danger',  '非公開'],
  ];
  return (
    <div style={{ padding: 32, display: 'flex', flexDirection: 'column', gap: 20 }}>
      {/* フィルタバー */}
      <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
        <input placeholder="商品名・品番で検索"
          style={{
            flex: 1, maxWidth: 320, minHeight: 48, padding: '0 16px',
            border: `1px solid ${C.line}`, borderRadius: 6,
            fontSize: fs.base, color: C.ink,
          }} />
        <select style={{
          minHeight: 48, padding: '0 14px', border: `1px solid ${C.line}`,
          borderRadius: 6, fontSize: fs.base, color: C.ink, background: C.surface,
        }}>
          <option>すべてのカテゴリ</option>
          <option>クラリネット</option>
          <option>サクソフォン</option>
        </select>
        <select style={{
          minHeight: 48, padding: '0 14px', border: `1px solid ${C.line}`,
          borderRadius: 6, fontSize: fs.base, color: C.ink, background: C.surface,
        }}>
          <option>すべての状態</option>
          <option>公開中</option>
          <option>下書き</option>
          <option>非公開</option>
        </select>
        <div style={{ flex: 1 }} />
        <PrimaryButton fs={fs}>＋ 商品を追加</PrimaryButton>
      </div>

      <Card fs={fs}>
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ borderBottom: `2px solid ${C.line}` }}>
              {['商品名', 'カテゴリ', '品番（Handle）', '価格（税抜・社内用）', '状態', ''].map(h => (
                <th key={h} style={{
                  textAlign: h.includes('価格') ? 'right' : 'left', padding: '10px 8px',
                  fontSize: fs.base - 2, fontWeight: 700, color: C.inkSub,
                }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {products.map(([name, cat, handle, price, type, status]) => (
              <tr key={handle} style={{ borderBottom: `1px solid ${C.lineLight}` }}>
                <td style={{ padding: '14px 8px', fontSize: fs.base - 1, color: C.ink, fontWeight: 500 }}>{name}</td>
                <td style={{ padding: '14px 8px', fontSize: fs.base - 1, color: C.inkSub }}>{cat}</td>
                <td style={{ padding: '14px 8px', fontSize: fs.base - 2, color: C.inkMute, fontFamily: 'monospace' }}>{handle}</td>
                <td style={{ padding: '14px 8px', fontSize: fs.base - 1, color: C.ink, textAlign: 'right', fontVariantNumeric: 'tabular-nums' }}>{yen(price)}</td>
                <td style={{ padding: '14px 8px' }}>
                  <StatusBadge type={type} label={status} fs={fs} />
                </td>
                <td style={{ padding: '14px 8px', textAlign: 'right' }}>
                  <button style={{
                    minHeight: 40, padding: '0 14px', border: `1px solid ${C.line}`,
                    borderRadius: 5, background: C.surface, color: C.info,
                    fontSize: fs.base - 2, fontWeight: 500, cursor: 'pointer',
                  }}>編集</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
        <div style={{
          marginTop: 16, paddingTop: 16, borderTop: `1px solid ${C.lineLight}`,
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        }}>
          <span style={{ fontSize: fs.base - 2, color: C.inkSub }}>全 294 件中 1〜7 件を表示</span>
          <div style={{ display: 'flex', gap: 6 }}>
            {['前へ', '1', '2', '3', '次へ'].map((t, i) => (
              <button key={i} style={{
                minWidth: 44, minHeight: 44, border: `1px solid ${C.line}`,
                borderRadius: 5, cursor: 'pointer', fontSize: fs.base - 2,
                background: t === '1' ? C.navy : C.surface,
                color: t === '1' ? '#FFFFFF' : C.inkSub,
                fontWeight: t === '1' ? 700 : 400,
              }}>{t}</button>
            ))}
          </div>
        </div>
      </Card>

      {/* 価格非表示の注記 */}
      <div style={{
        display: 'flex', gap: 10, alignItems: 'flex-start',
        background: C.infoBg, border: `1px solid ${C.info}40`,
        borderRadius: 6, padding: '14px 16px',
      }}>
        {Icon.info(fs.base, C.info)}
        <span style={{ fontSize: fs.base - 2, color: C.inkSub, lineHeight: 1.7 }}>
          価格は管理画面でのみ表示されます。公開サイトでは全商品の価格を非表示にし、見積依頼へ誘導する運用です。
