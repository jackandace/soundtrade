function useViewport() {
  const [w, setW] = useState(typeof window !== 'undefined' ? window.innerWidth : 1280);
  useEffect(() => {
    const fn = () => setW(window.innerWidth);
    window.addEventListener('resize', fn);
    return () => window.removeEventListener('resize', fn);
  }, []);
  return { w, isMobile: w < 768 };
}

          <nav style={{ display: 'flex', gap: 40, alignItems: 'center' }}>

function StockBadge({ stock }) {
  const map = {
    in:    { label: '在庫あり', color: C.inStock },
    order: { label: '受注生産', color: C.order },
  };
  const s = map[stock] || map.in;
  return (
    <span style={{
      fontSize: 11, color: s.color, letterSpacing: '0.06em',
      display: 'inline-flex', alignItems: 'center', gap: 5,
    }}>
      <span style={{ width: 5, height: 5, borderRadius: '50%', background: s.color, display: 'inline-block' }} />
      {s.label}
    </span>
  );
}

  const [catFilter, setCatFilter] = useState('all');

  const filtered = useMemo(() => {
    let list = catFilter === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.cat === catFilter);
    if (sort === 'price-asc') list = [...list].sort((a,b) => a.price - b.price);
    if (sort === 'price-desc') list = [...list].sort((a,b) => b.price - a.price);

    <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>

                  {isMobile && (
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 12 }}>
                      <div style={{ display: 'flex', border: `1px solid ${C.lineMid}` }}>
                        <button onClick={() => onQty(item.handle, Math.max(1,item.qty-1))} style={{ width: 40, height: 40, background: C.white, border: 'none', cursor: 'pointer', fontSize: 16 }}>−</button>
                        <div style={{ width: 44, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, borderLeft: `1px solid ${C.line}`, borderRight: `1px solid ${C.line}` }}>{item.qty}</div>
                        <button onClick={() => onQty(item.handle, item.qty+1)} style={{ width: 40, height: 40, background: C.white, border: 'none', cursor: 'pointer', fontSize: 16 }}>＋</button>
                      </div>
                      <button onClick={() => onRemove(item.handle)} style={{
                        background: 'none', border: 'none', cursor: 'pointer', fontSize: 12,
                        color: C.gray, borderBottom: `1px solid ${C.line}`, paddingBottom: 2,
                      }}>削除</button>
                    </div>
                  )}
                </div>
                {!isMobile && (
                  <div style={{ textAlign: 'right' }}>
                    <div style={{ display: 'flex', border: `1px solid ${C.lineMid}`, marginBottom: 10 }}>
                      <button onClick={() => onQty(item.handle, Math.max(1,item.qty-1))} style={{ width: 36, height: 36, background: C.white, border: 'none', cursor: 'pointer', fontSize: 15 }}>−</button>
                      <div style={{ width: 44, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, borderLeft: `1px solid ${C.line}`, borderRight: `1px solid ${C.line}` }}>{item.qty}</div>
                      <button onClick={() => onQty(item.handle, item.qty+1)} style={{ width: 36, height: 36, background: C.white, border: 'none', cursor: 'pointer', fontSize: 15 }}>＋</button>
                    </div>
                    <button onClick={() => onRemove(item.handle)} style={{
                      background: 'none', border: 'none', cursor: 'pointer', fontSize: 11,
                      color: C.gray, borderBottom: `1px solid ${C.line}`, paddingBottom: 2,
                    }}>削除</button>
                  </div>
                )}
              </div>
            ))}
          </div>

          <div style={{ border: `1px solid ${C.line}`, background: C.white, padding: isMobile ? 20 : 28 }}>
            <div style={{ fontSize: 14, fontWeight: 500, color: C.sumi, marginBottom: 18, letterSpacing: '0.04em' }}>
              見積サマリー
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, color: C.sumiLight, marginBottom: 16, paddingBottom: 16, borderBottom: `1px solid ${C.line}` }}>
              <span>商品点数</span><span style={{ color: C.sumi, fontWeight: 500 }}>{totalQty} 点</span>
            </div>
            <p style={{ fontSize: 12, color: C.sumiLight, lineHeight: 1.9, marginBottom: 18 }}>
              卸価格はお取引内容・数量に応じて個別にご案内しております。
              下記より見積をご依頼ください。担当者が2営業日以内にお見積もりをお送りします。
            </p>
            {/* メインCTA：見積依頼へ（価格の代わりに最も目立たせる） */}
            <button onClick={() => onNav('inquiry')} style={{
              width: '100%', minHeight: 56, background: C.sumi, color: C.white,
              border: `1px solid ${C.sumi}`, padding: '16px',
              fontSize: 15, fontWeight: 500, letterSpacing: '0.06em', cursor: 'pointer',
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
            }}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke={C.white} strokeWidth="1.8">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
              見積依頼へ進む
            </button>
            <button onClick={() => onNav('catalog')} style={{
              width: '100%', background: 'transparent', color: C.sumi, border: `1px solid ${C.lineMid}`,
              padding: '14px', fontSize: 13, letterSpacing: '0.04em', cursor: 'pointer', marginTop: 12,
            }}>買い物を続ける</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// 見積依頼フォームページ
// ============================================================
function InquiryPage({ cart, onNav, isMobile }) {
  const [done, setDone] = useState(false);

  if (done) {
    return (
      <div style={{ background: C.ivory, minHeight: '70vh' }}>
        <div style={{ maxWidth: 640, margin: '0 auto', padding: isMobile ? '80px 20px' : '120px 48px', textAlign: 'center' }}>
          <div style={{
            width: 56, height: 56, borderRadius: '50%', border: `1.5px solid ${C.inStock}`,
            display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 28px',
            fontSize: 24, color: C.inStock,
          }}>✓</div>
          <h1 style={{ fontSize: isMobile ? 24 : 28, fontWeight: 300, color: C.sumi, margin: '0 0 16px' }}>
            見積依頼を受け付けました
          </h1>
          <p style={{ fontSize: 14, color: C.sumiLight, lineHeight: 2, marginBottom: 8 }}>
            受付番号 <span style={{ fontFamily: "'DM Sans', sans-serif", fontWeight: 500, color: C.sumi }}>ST-20260520-0042</span>
          </p>
          <p style={{ fontSize: 13, color: C.sumiLight, lineHeight: 2, marginBottom: 36 }}>
            ご入力のメールアドレスに確認メールをお送りしました。<br />
            担当者より2営業日以内に見積書をお送りいたします。
          </p>
          <button onClick={() => onNav('home')} style={{
            background: C.sumi, color: C.white, border: `1px solid ${C.sumi}`,
            padding: '15px 36px', fontSize: 14, letterSpacing: '0.06em', cursor: 'pointer',
          }}>トップへ戻る</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ background: C.ivory, minHeight: '70vh' }}>
      <div style={{ maxWidth: 1280, margin: '0 auto', padding: isMobile ? '32px 20px 64px' : '64px 48px 100px' }}>
        <div style={{ fontSize: 12, color: C.gray, marginBottom: isMobile ? 20 : 32, letterSpacing: '0.04em' }}>
          ホーム ／ 見積カート ／ 見積依頼
        </div>
        <h1 style={{ fontSize: isMobile ? 26 : 34, fontWeight: 300, color: C.sumi, margin: '0 0 32px' }}>見積依頼フォーム</h1>

        <div style={{
          display: 'grid',
          gridTemplateColumns: isMobile ? '1fr' : '1fr 340px',
          gap: isMobile ? 24 : 56, alignItems: 'start',
        }}>
          <div style={{ border: `1px solid ${C.line}`, background: C.white, padding: isMobile ? 24 : 40, order: isMobile ? 2 : 1 }}>
            <div style={{ display: 'grid', gap: 22 }}>
              {[
                ['会社名 / 屋号', '株式会社サウンドミュージック', true],
                ['ご担当者名', '山田 太郎', true],
                ['メールアドレス', 'yamada@example.com', true],
                ['電話番号', '03-1234-5678', true],
              ].map(([label, ph, req]) => (
                <Field key={label} label={label} placeholder={ph} required={req} />
              ))}
              <div>
                <FieldLabel label="希望納期" />
                <select style={inputStyle}>
                  <option>できるだけ早く</option>
                  <option>1ヶ月以内</option>
                  <option>2〜3ヶ月以内</option>
                  <option>未定 / 相談したい</option>
                </select>
              </div>
              <div>
                <FieldLabel label="ご要望・備考" />
                <textarea rows={4} placeholder="数量の相談、納品先のご指定などがあればご記入ください"
                  style={{ ...inputStyle, resize: 'vertical', fontFamily: 'inherit' }} />
              </div>
            </div>
          </div>

          <div style={{ border: `1px solid ${C.line}`, background: C.white, padding: isMobile ? 20 : 28, order: isMobile ? 1 : 2 }}>
            <div style={{ fontSize: 14, fontWeight: 500, color: C.sumi, marginBottom: 18, letterSpacing: '0.04em' }}>
              依頼内容（{cart.length}商品）
            </div>
            {cart.map(item => (
              <div key={item.handle} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, marginBottom: 11, gap: 12 }}>
                <span style={{ color: C.sumi }}>{item.name}<span style={{ color: C.gray }}> ×{item.qty}</span></span>
              </div>
            ))}
            <div style={{
              fontSize: 11, color: C.sumiLight, lineHeight: 1.8, paddingTop: 16,
              marginTop: 8, borderTop: `1px solid ${C.line}`,
            }}>
              上記 {cart.length} 商品について、担当者よりお見積もりをご案内いたします。
            </div>
            <button onClick={() => setDone(true)} style={{
              width: '100%', background: C.sumi, color: C.white, border: `1px solid ${C.sumi}`,
              padding: '16px', fontSize: 14, letterSpacing: '0.06em', cursor: 'pointer', marginTop: 22,
            }}>この内容で見積を依頼する</button>
            <p style={{ fontSize: 11, color: C.gray, lineHeight: 1.8, marginTop: 14, textAlign: 'center' }}>
              送信により<span style={{ borderBottom: `1px solid ${C.gray}` }}>プライバシーポリシー</span>に同意したものとみなします
            </p>
          </div>
        </div>
      </div>
    </div>
  );
}

const inputStyle = {
  width: '100%', border: `1px solid ${C.lineMid}`, background: C.white,
  padding: '14px', fontSize: 15, color: C.sumi, boxSizing: 'border-box', minHeight: 48,
};

function FieldLabel({ label, required }) {
  return (
    <div style={{ fontSize: 13, color: C.sumi, marginBottom: 8, fontWeight: 500 }}>
      {label}
      {required && <span style={{ color: C.err, fontSize: 11, marginLeft: 8 }}>必須</span>}
    </div>
  );
}

function Field({ label, placeholder, required }) {
  return (
    <div>
      <FieldLabel label={label} required={required} />
      <input placeholder={placeholder} style={inputStyle} />
    </div>
  );
}

// ============================================================
// ルートApp
// ============================================================
function App() {
  const { isMobile } = useViewport();
  const [page, setPage] = useState('home');
  const [product, setProduct] = useState(null);
  const [cart, setCart] = useState([]);

  useEffect(() => { window.scrollTo(0, 0); }, [page, product]);

  const addToCart = (p, qty) => {
    setCart(prev => prev.find(i => i.handle === p.handle) ? prev : [...prev, { ...p, qty }]);
  };
  const updateQty = (handle, qty) =>
    setCart(prev => prev.map(i => i.handle === handle ? { ...i, qty } : i));
  const removeItem = (handle) =>
    setCart(prev => prev.filter(i => i.handle !== handle));
  const goProduct = (p) => { setProduct(p); setPage('product'); };

  return (
    <div style={{
      fontFamily: "'Noto Sans JP', -apple-system, sans-serif",
      background: C.ivory, minHeight: '100vh', color: C.sumi,
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap');
        * { box-sizing: border-box; }
        button { font-family: inherit; }
        select, input, textarea { font-family: 'Noto Sans JP', sans-serif; outline: none; }
        select:focus, input:focus, textarea:focus { border-color: ${C.sumi}; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: ${C.lineMid}; }
        @keyframes logoScroll {
          from { transform: translateX(0); }
          to { transform: translateX(-50%); }
        }
      `}</style>

      <Header
        nav={page === 'product' ? 'catalog' : page}
        cartCount={cart.reduce((s,i)=>s+i.qty,0)}
        onNav={setPage}
        isMobile={isMobile}
      />
      <MakerBar isMobile={isMobile} />

      {page === 'home' && <HomePage onNav={setPage} onProduct={goProduct} isMobile={isMobile} />}
      {page === 'catalog' && <CatalogPage onProduct={goProduct} isMobile={isMobile} />}
      {page === 'product' && product && (
        <ProductPage
          product={product} onAddCart={addToCart}
          onBack={() => setPage('catalog')}
          inCart={!!cart.find(i => i.handle === product.handle)}
          isMobile={isMobile}
        />
      )}
      {page === 'cart' && (
        <CartPage cart={cart} onQty={updateQty} onRemove={removeItem} onNav={setPage} isMobile={isMobile} />
      )}
      {page === 'inquiry' && (
        <InquiryPage cart={cart} onNav={setPage} isMobile={isMobile} />
      )}

      <Footer isMobile={isMobile} />

      <div style={{
        position: 'fixed', bottom: 12, right: 12, background: C.sumi, color: C.white,
        fontSize: 10, padding: '7px 13px', letterSpacing: '0.04em', borderRadius: 3, opacity: 0.85,
      }}>
        DESIGN COMP v2 — 公開サイト / 価格クローズ
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(App, null)
);
</script>
</body>
</html>
